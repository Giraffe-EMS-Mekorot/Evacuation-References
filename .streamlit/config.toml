# Deep forest green + earthy gold-brown + warm cream theme (company palette),
# now with Rubik (Google Fonts, Hebrew-supporting) instead of generic
# sans-serif. That's a deliberate trade-off from the earlier offline-safe
# choice: Rubik needs internet access to load; the final "sans-serif" in the
# font list is a plain built-in fallback, so a blocked/offline network
# degrades to a generic (but still readable) font instead of breaking
# anything.
#
# Only ONE font may be fetched via the URL half of this string - Streamlit
# raises StreamlitAPIException ("contains multiple fonts") on every session
# message if the query string has more than one `family=` parameter, which
# in turn corrupts the message stream to the browser (surfaces there as a
# generic "Connection lost" error - e.g. on the file uploader, misleadingly
# looking like a rejected/invalid file). Verified with a real headless
# browser: this exact exception, repeating on every rerun, was the cause of
# a real bug report where every uploaded file showed as invalid. An earlier
# version of this line tried to load both Rubik and Assistant in one URL -
# don't reintroduce that; if a second Hebrew fallback is ever wanted, it
# needs a locally-installed font name (no URL) or a font-face defined via
# [[theme.fontFaces]] instead, not a second `family=` here.
[theme]
base = "light"
# Deepened 2026-09 (was #1B4332) as part of a bolder-palette design pass -
# see streamlit_app.py's _ACCENT_GREEN_DARK for the same value used directly
# in custom CSS/HTML there, and _ACCENT_GREEN_LIGHT for a lighter step of it
# recomputed to stay in proportion against this deeper base.
primaryColor = "#12291C"
backgroundColor = "#FAF7F0"
secondaryBackgroundColor = "#F0EBE0"
textColor = "#1A1A1A"
linkColor = "#8B6F47"
borderColor = "#D9CCB8"
font = "Rubik:https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap"
baseFontWeight = 300
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true

redColor = "#C0392B"
yellowColor = "#B7860B"
# Bolder gold accent (2026-09, was #C9982F) - see streamlit_app.py's
# _ACCENT_GOLD for the same value used directly in custom CSS/HTML (upload
# border, stat cards, upload badge, primary-button border, high-confidence
# accent in the results table).
orangeColor = "#D4A24C"
# greenColor matches primaryColor, grayColor is repurposed as the gold-brown
# accent (not an actual gray) - kept for any :green[]/:gray[] markdown text
# elsewhere in the app to stay on-palette; the main title/caption no longer
# use those directives themselves (the header card's CSS forces light text
# there directly, since they sit on the dark gradient background instead).
greenColor = "#1B4332"
grayColor = "#8B6F47"

dataframeBorderColor = "#D9CCB8"
dataframeHeaderBackgroundColor = "#F0EBE0"

# Bigger, bolder headings for clearer hierarchy (weight carries as much of
# the hierarchy as size does, per the design request) - h1 (st.title) most
# of all, tapering down through h2-h6.
headingFontSizes = ["46px", "28px", "22px", "18px", "16px", "14px"]
headingFontWeights = [900, 700, 700, 600, 600, 600]
